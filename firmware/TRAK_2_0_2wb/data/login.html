<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0f10">
<title>TRAK - Connexion</title>
<style>
:root{--bg:#0d0f10;--surface:rgba(23,26,28,.92);--border:rgba(255,255,255,.12);--text:#f2f4f5;--muted:#8e969b;--accent:#0186ff;--danger:#ff3483}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 30%,rgba(1,134,255,.16),transparent 35%);pointer-events:none}
.login{position:relative;width:min(100%,390px);background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:0 20px 70px rgba(0,0,0,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{text-align:center;font-size:2rem;font-weight:800;letter-spacing:.08em}
.subtitle{text-align:center;color:var(--muted);margin:7px 0 28px;font-size:.95rem}
label{display:block;margin:0 0 7px;font-size:.85rem;color:var(--muted)}
input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);outline:none;margin-bottom:16px}
input:focus{border-color:rgba(1,134,255,.65);box-shadow:0 0 0 3px rgba(1,134,255,.12)}
.password-row{display:flex;gap:8px;align-items:center;margin:-2px 0 18px;color:var(--muted);font-size:.82rem}
.password-row input{width:auto;margin:0}
button{width:100%;padding:13px 14px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:750;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
#error{min-height:21px;margin:0 0 12px;text-align:center;color:var(--danger);font-size:.86rem}
.footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:20px}
</style>
</head>
<body>
<main class="login">
  <div class="brand"><img src="/logo_dark_web.png" height="30px"></div>
  <div class="subtitle">Open-Source GPS Tracker</div>
  <form id="loginForm" autocomplete="on">
    <label for="username">Utilisateur</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="password-row">
      <input id="showPassword" type="checkbox">
      <label for="showPassword" style="margin:0">Afficher le mot de passe</label>
    </div>
    <div id="error"></div>
    <button id="submit" type="submit">Se connecter</button>
  </form>
</main>
<script>
const form=document.getElementById('loginForm');
const user=document.getElementById('username');
const pass=document.getElementById('password');
const error=document.getElementById('error');
const submit=document.getElementById('submit');
document.getElementById('showPassword').addEventListener('change',e=>pass.type=e.target.checked?'text':'password');
form.addEventListener('submit',async e=>{
  e.preventDefault(); error.textContent=''; submit.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value}),cache:'no-store'});
    if(!r.ok){error.textContent='Identifiant ou mot de passe incorrect';pass.select();return;}
    window.location.replace('/');
  }catch(_){error.textContent='Connexion impossible avec le TRAK';}
  finally{submit.disabled=false;}
});
</script>
</body>
</html>
