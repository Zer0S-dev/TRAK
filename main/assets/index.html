<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />

    <title>TRAK - Connexion</title>

    <style>

        :root{
          --bg:#183029;
          --accent:#b1d600;
          --surface:#fff;
          --border:#e6ebf1;
          --text:#183029;
          --muted:#8e969b;
          --error:#ff5c5c;
          --success:#35c759;
        }

        *{
          box-sizing:border-box;
        }

        html,
        body{
          margin:0;
          padding:0;
          width:100%;
          height:100%;
          overflow:hidden;

          background:var(--bg);
          color:var(--text);

          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        }

        body{

          display:flex;
          align-items:center;
          justify-content:center;

         background: radial-gradient( circle at 50% 35%, rgba(177,214,0,.10), transparent 42% ), var(--bg);
        }


        /* ============================================================
           ÉCRAN DE CONNEXION
           ============================================================ */

        .start-screen{

          width:100%;
          height:100%;

          display:flex;
          align-items:center;
          justify-content:center;

          padding:30px;
        }


        .content{

          width:min(100%,420px);

          display:flex;
          flex-direction:column;
          align-items:center;

          text-align:center;
        }


        /* ============================================================
           LOGO
           ============================================================ */

        .logo{

          margin-bottom:18px;
          min-height:32px;
        }


        .logo img{

          max-width:180px;
          max-height:42px;

          object-fit:contain;
        }


        /* ============================================================
           SOUS-TITRE
           ============================================================ */

        .subtitle{

          color:var(--muted);

          font-size:.85rem;

          margin-bottom:45px;
        }

.intro {
  text-align: left;
  color: var(--muted);
}
        /* ============================================================
           CARTE
           ============================================================ */

        .network-card{

          width:100%;

          padding:32px 24px;

          background:var(--surface);

          backdrop-filter:blur(16px);
          -webkit-backdrop-filter:blur(16px);

          border:1px solid var(--border);

          border-radius:22px;

          box-shadow:
            0 12px 30px rgba(10,37,64,.08),0 2px 6px rgba(10,37,64,.05)
        }


        /* ============================================================
           TEXTE DE CONNEXION
           ============================================================ */

        .network-title{

          font-size:.95rem;

          font-weight:650;

          color:var(--text);

          margin-bottom:24px;
        }


        /* ============================================================
           LOADER
           ============================================================ */

        .loader{

          display:flex;

          flex-direction:column;

          align-items:center;

          gap:14px;
        }


        .spinner{

          width:32px;
          height:32px;

          border-radius:50%;

          border:3px solid rgba(255,255,255,.12);

          border-top-color:var(--accent);

          animation:
            spin .8s linear infinite;
        }


        @keyframes spin{

          to{
            transform:rotate(360deg);
          }
        }


        .status{

          color:var(--muted);

          font-size:.82rem;

          min-height:20px;
        }


        /* ============================================================
           ÉTAT TROUVÉ
           ============================================================ */

        .success-icon{

          width:62px;
          height:62px;

          display:none;

          align-items:center;
          justify-content:center;

          border-radius:50%;

          background:rgba(53,199,89,.12);

          color:var(--success);

          font-size:18px;
          font-weight:700;
          margin-left: auto;
      margin-right: auto;
        }


        /* ============================================================
           ÉTAT ERREUR
           ============================================================ */

        .error-icon{

          width:62px;
          height:62px;

          display:none;

          align-items:center;
          justify-content:center;

          border-radius:50%;

          background:rgba(255,92,92,.12);

          color:var(--error);

          font-size:18px;
          font-weight:700;
          margin-left: auto;
      margin-right: auto;
        }


        /* ============================================================
           BOUTON RECONNECTER
           ============================================================ */

        .reconnect-button{

          display:none;

          width:100%;

          min-height:56px;

          margin-top:22px;

          border-radius:15px;

         

          background:var(--bg);

          color:var(--accent);

          font-family:inherit;

          font-size:.92rem;
          border: none;
          font-weight:650;

          cursor:pointer;

          transition:
            background .18s ease,
            transform .12s ease,
            opacity .18s ease;
        }


        .reconnect-button:hover{

        background:var(--bg);
        opacity: 0.8;
        }


        .reconnect-button:active{

          transform:scale(.98);
        }


        .reconnect-button.loading{

          pointer-events:none;

          opacity:.55;
        }


        /* ============================================================
           FOOTER
           ============================================================ */

        .footer{

          position:fixed;

          bottom:18px;

          left:0;
          right:0;

          text-align:center;

          color:#555;

          font-size:10px;
        }


        /* ============================================================
           MOBILE
           ============================================================ */

        @media(max-width:480px){

          .network-card{

            padding:28px 20px;
          }

        }
    </style>
  </head>

  <body>
    <div id="startScreen" class="start-screen">
      <div class="content">
        <!-- LOGO -->

        <div class="logo">
          <img
            src="logo_dark_web.png"
            alt="Zer0S Tracker"
            onerror="this.style.display='none'"
          />
        </div>

        <!-- SOUS-TITRE -->

        <div class="subtitle">Connexion au tracker
</br>

        </div>

        <!-- CARTE -->

        <div class="network-card">
          <div id="networkTitle" class="network-title">
            Recherche du tracker…
          </div>

          <!-- LOADER -->

          <div id="loader" class="loader">
            <div class="spinner"></div>

            <div id="status" class="status">Recherche du tracker…</div>
          </div>

          <!-- SUCCÈS -->

          <div id="successIcon" class="success-icon">✓</div>

          <!-- ERREUR -->

          <div id="errorIcon" class="error-icon">!</div>

          <!-- RECONNECTER -->

          <button id="reconnectButton" class="reconnect-button" type="button">
            Re-connecter
          </button>
        </div>
        <p class="intro">Assurez-vous que vous soyez connecté en Wifi Direct à "TRAK" ou que TRAK soit connecté en Wifi sur le même réseau local que votre mobile / tablette /ordinateur. (TRAK dashboard -> Reglages -> Ajouter réseau)</p>
      </div>

    </div>


    <div class="footer">2026 © Zer0s Dev</div>

    <script>


      /* ============================================================
         ÉLÉMENTS
         ============================================================ */

      const loader =
        document.getElementById(
          "loader"
        );


      const status =
        document.getElementById(
          "status"
        );


      const networkTitle =
        document.getElementById(
          "networkTitle"
        );


      const successIcon =
        document.getElementById(
          "successIcon"
        );


      const errorIcon =
        document.getElementById(
          "errorIcon"
        );


      const reconnectButton =
        document.getElementById(
          "reconnectButton"
        );


      /* ============================================================
         ÉTAT
         ============================================================ */

      let connecting = false;


      /* ============================================================
         RECHERCHE
         ============================================================ */

      function connectTracker(){

        if(connecting){

          return;
        }

        connecting = true;


        /* Réinitialisation */

        loader.style.display =
          "flex";

        successIcon.style.display =
          "none";

        errorIcon.style.display =
          "none";

        reconnectButton.style.display =
          "none";

        reconnectButton.classList.add(
          "loading"
        );


        networkTitle.textContent =
          "Recherche du tracker…";


        status.textContent =
          "Recherche du tracker…";


        console.log(
          "TRAK: demande de connexion automatique"
        );


        /*
         * Appel Android.
         */

        if(
          window.Android &&
          typeof Android.connectToTracker ===
            "function"
        ){

          Android.connectToTracker();

          return;
        }


        /*
         * Fallback navigateur.
         *
         * Normalement cette partie ne sera
         * jamais utilisée dans l'application.
         */

        connecting = false;

        loader.style.display =
          "none";

        errorIcon.style.display =
          "flex";

        networkTitle.textContent =
          "Tracker introuvable";

        status.textContent =
          "Connexion disponible uniquement dans l'application";


        reconnectButton.style.display =
          "block";

        reconnectButton.classList.remove(
          "loading"
        );
      }


      /* ============================================================
         RECONNECTER
         ============================================================ */

      reconnectButton.addEventListener(
        "click",
        function(){

          connectTracker();

        }
      );


      /* ============================================================
         API ANDROID
         ============================================================ */

      /*
       * Ces fonctions sont appelées depuis MainActivity.
       *
       * Elles permettent à Android de mettre à jour
       * l'interface avant de charger le dashboard.
       */


      /*
       * Recherche en cours.
       */

      window.trackerSearching =
        function(){

          connecting = true;

          loader.style.display =
            "flex";

          successIcon.style.display =
            "none";

          errorIcon.style.display =
            "none";

          reconnectButton.style.display =
            "none";

          networkTitle.textContent =
            "Recherche du tracker…";

          status.textContent =
            "Recherche du tracker…";
        };


      /*
       * Tracker trouvé.
       */

      window.trackerFound =
        function(){

          connecting = false;

          loader.style.display =
            "none";

          errorIcon.style.display =
            "none";

          successIcon.style.display =
            "flex";

          networkTitle.textContent =
            "Tracker trouvé !";

          status.textContent =
            "Connexion au dashboard…";
        };


      /*
       * Tracker introuvable.
       */

      window.trackerNotFound =
        function(){

          connecting = false;

          loader.style.display =
            "none";

          successIcon.style.display =
            "none";

          errorIcon.style.display =
            "flex";

          networkTitle.textContent =
            "Tracker introuvable";

          status.textContent =
            "Vérifiez la connexion WiFi du téléphone.";

          reconnectButton.style.display =
            "block";

          reconnectButton.classList.remove(
            "loading"
          );
        };


      /* ============================================================
         DÉMARRAGE AUTOMATIQUE
         ============================================================ */

      window.addEventListener(
        "load",
        function(){

          console.log(
            "TRAK: écran de connexion prêt"
          );


          /*
           * Petit délai pour laisser la WebView
           * terminer son initialisation.
           */

          setTimeout(
            function(){

              connectTracker();

            },
            150
          );

        }
      );
    </script>
  </body>
</html>
